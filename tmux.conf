# NOTE: make sure you launch tmux and run `prefix+I` to initialize TPM
# this config designed for terminal -> SSH to Linux -> tmux -> nvim

# NOTE:
# ===== Core Philosophy =====
# WezTerm = renderer only
# tmux = sessions/windows
# nvim = editing

# for pre-3.6+ tmux, get the most recent version instead, eg 3.6a:
#  cd /tmp
#  curl -LO https://github.com/tmux/tmux-builds/releases/download/v3.6a/tmux-3.6a-linux-x86_64.tar.gz
#  tar -tzf tmux-3.6a-linux-x86_64.tar.gz
#  tar -xzf tmux-3.6a-linux-x86_64.tar.gz
#  install -m 755 tmux ~/.local/bin/tmux
#  type -a tmux
#  tmux -V

# Allow vim motions in copy-mode
setw -g mode-keys vi

# General options
set-option -w -g aggressive-resize on
set -g default-terminal "tmux-256color"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
bind -T root WheelUpPane if-shell -F -t= "#{mouse_any_flag}" "send-keys -M" "copy-mode -e"

# OSC 52 clipboard - let escape sequences pass through
set -g set-clipboard on
set -s extended-keys always
set -g allow-passthrough on
set -as terminal-features ',tmux-256color:clipboard'
set -as terminal-features ',xterm*:extkeys'

# Quick window nav: Alt+h/l
bind -n M-c new-window -c "#{pane_current_path}"
bind -n M-h previous-window
bind -n M-l next-window
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9

# Quick session nav: Alt+j/k
bind -n M-j switch-client -n \; refresh-client -S 
bind -n M-k switch-client -p \; refresh-client -S

# Quick session manager: Alt+s
bind -n M-s choose-session

# Easier pane creation
bind -n M-+ split-window -h -c "#{pane_current_path}"
bind -n M-- split-window -v -c "#{pane_current_path}"

# Kill pane
bind -n M-q kill-pane

# Easier panes movement
bind -n C-M-h select-pane -L
bind -n C-M-j select-pane -D
bind -n C-M-k select-pane -U
bind -n C-M-l select-pane -R

# Easier pane resizing
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

# Rename stuff
bind -n M-, command-prompt -I "#W" "rename-window '%%'"
bind -n M-w command-prompt -I "#S" "rename-session '%%'"

# Easier entrance into copy mode
bind -n M-/ copy-mode

# Quick keymap reference
bind -n M-? display-menu -T "tmux keys" -x C -y C \
  "New window"        c  "new-window -c '#{pane_current_path}'" \
  "Prev window"       h  "previous-window" \
  "Next window"       l  "next-window" \
  "Window 1..9"       1  "display-message 'Alt+1..9 selects windows'" \
  ""                  "" "" \
  "Prev session"      j  "switch-client -p" \
  "Next session"      k  "switch-client -n" \
  "Choose session"    s  "choose-session" \
  ""                  "" "" \
  "Split horizontal"  +  "split-window -h -c '#{pane_current_path}'" \
  "Split vertical"    -  "split-window -v -c '#{pane_current_path}'" \
  "Kill pane"         q  "kill-pane" \
  "Pane left"         H  "select-pane -L" \
  "Pane down"         J  "select-pane -D" \
  "Pane up"           K  "select-pane -U" \
  "Pane right"        L  "select-pane -R" \
  "Copy mode"         /  "copy-mode" \
  ""                  "" "" \
  "Rename window"     ,  "command-prompt -I '#W' \"rename-window '%%'\"" \
  "Rename session"    w  "command-prompt -I '#S' \"rename-session '%%'\""

# Plugin manager start
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Custom plugins
set -g @plugin 'theutz/tmux-tokyonight-nvim'
set -g @tokyonight 'moon'
# set-option -ga terminal-overrides ",xterm-256color:Tc" # old setting - may be useful later
set -as terminal-overrides ",*:Tc"

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'

# Override theme date format: "Fri 03-27" style
# MUST be after TPM load to avoid theme overwriting
set -g status-right "#[fg=#1e2030,bg=#1e2030,nobold,nounderscore,noitalics]\ue0b2#[fg=#82aaff,bg=#1e2030] #{prefix_highlight} #[fg=#3b4261,bg=#1e2030,nobold,nounderscore,noitalics]\ue0b2#[fg=#82aaff,bg=#3b4261] %a %m-%d \ue0b3 %I:%M %p #[fg=#82aaff,bg=#3b4261,nobold,nounderscore,noitalics]\ue0b2#[fg=#1b1d2b,bg=#82aaff,bold] #h "
