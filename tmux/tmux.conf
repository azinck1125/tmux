# NOTE: make sure you launch tmux and run `prefix+I` to initialize TPM
# this config designed for windows terminal -> SSH-Linux -> tmux/nvim

# Allow vim motions in copy-mode
setw -g mode-keys vi

# Secondary prefix for primary use
set -g prefix2 C-f
bind C-f send-prefix

# General options
set-option -w -g aggressive-resize on
# set -g status-right "%a, %b %d"
set -g default-terminal "tmux-256color"
set -g mouse on
bind -T root WheelUpPane if-shell -F -t= "#{mouse_any_flag}" "send-keys -M" "copy-mode -e"

# OSC 52 clipboard - let escape sequences pass through to Windows Terminal
set -g set-clipboard on
set -g allow-passthrough all
set -as terminal-features ',tmux-256color:clipboard'

# Quick window nav: Alt+h/l
bind -n M-h previous-window
bind -n M-l next-window

# Quick session nav: Alt+j/k
bind -n M-j switch-client -n \; refresh-client -S \; display-message " #{client_session}"
bind -n M-k switch-client -p \; refresh-client -S \; display-message " #{client_session}"

# Quick session manager: Alt+s
bind -n M-s choose-session

# Easier pane creation
bind -n M-+ split-window -h # -c "#{pane_current_path}"
bind -n M-- split-window -v # -c "#{pane_current_path}"

# Easier panes movement
bind -n C-M-h select-pane -L
bind -n C-M-j select-pane -D
bind -n C-M-k select-pane -U
bind -n C-M-l select-pane -R

# Easier pane resizing
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

# Rename stuff
bind -n M-, command-prompt -I "#W" "rename-window '%%'"
bind -n M-w command-prompt -I "#S" "rename-session '%%'"

# Kill pane
bind -n M-q kill-pane

# Easier entrance into copy mode
bind -n M-/ copy-mode

# Plugin manager start
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Custom plugins
set -g @plugin 'theutz/tmux-tokyonight-nvim'
set -g @tokyonight 'moon'
# set-option -ga terminal-overrides ",xterm-256color:Tc" # old setting - may be useful later
set -as terminal-overrides ",*:Tc"

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
